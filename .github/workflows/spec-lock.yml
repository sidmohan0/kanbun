name: spec-lock
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/devcontainer
      - name: Check the spec lock
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            ./scripts/devcontainer.sh exec env CI=true node scripts/check-spec-lock.mjs --initial
          else
            ./scripts/devcontainer.sh exec env CI=true node scripts/check-spec-lock.mjs "$BASE"
          fi
