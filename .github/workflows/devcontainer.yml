name: devcontainer

on:
  pull_request:
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer.yml"
      - ".gitignore"
      - ".prettierignore"
      - "eslint.config.mjs"
      - ".nvmrc"
      - ".npmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "apps/*/package.json"
      - "packages/*/package.json"
  push:
    branches: [main]
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer.yml"
      - ".gitignore"
      - ".prettierignore"
      - "eslint.config.mjs"
      - ".nvmrc"
      - ".npmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "apps/*/package.json"
      - "packages/*/package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Build and initialize devcontainer
        run: npx --yes @devcontainers/cli@0.90.0 up --workspace-folder .
      - name: Verify inside devcontainer
        run: npx --yes @devcontainers/cli@0.90.0 exec --workspace-folder . pnpm --silent verify --json
      - name: Upload container verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: devcontainer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/verification/
            artifacts/recovery/
          if-no-files-found: warn
