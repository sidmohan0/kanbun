name: Changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  packages: read

concurrency:
  group: changelog-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changelog:
    name: Changelog policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/devcontainer
        with:
          profile: policy
      - name: Test changelog policy
        run: ./scripts/devcontainer.sh exec env CI=true node --test scripts/check-changelog.test.mjs
      - name: Check PR entry or explicit exemption
        env:
          CHANGELOG_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p artifacts/verification/ci
          cp "$GITHUB_EVENT_PATH" artifacts/verification/ci/pull-request.json
          ./scripts/devcontainer.sh exec env CI=true CHANGELOG_BASE="$CHANGELOG_BASE" \
            node scripts/check-changelog.mjs --event artifacts/verification/ci/pull-request.json
