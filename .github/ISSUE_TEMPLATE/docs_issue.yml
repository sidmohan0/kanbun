name: Docs issue
description: Report missing, incorrect, or unclear documentation
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: textarea
    id: issue
    attributes:
      label: Documentation issue
      description: What is missing, incorrect, or confusing?
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: Location
      description: Point to the relevant file, section, or command.
