name: Feature request
description: Propose a new capability or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What operator problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed direction
      description: Describe the desired behavior or workflow.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Link ADRs, plans, or product docs if relevant.
