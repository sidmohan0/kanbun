    <path d="M575 136 C632 136 640 65 694 65 M684 58 L694 65 L684 72 M576 165 L694 165 M684 158 L694 165 L684 172 M575 193 C630 193 642 261 694 261 M684 254 L694 261 L684 268" stroke="#c2321f"/>
