  <g fill="#1c1b1a" font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <text x="155" y="132" font-size="23" font-weight="700">Browser</text><text x="155" y="164" font-size="15">Optimistic changes</text><text x="155" y="187" font-size="15">IndexedDB queue</text>
    <text x="476" y="132" font-size="23" font-weight="700">Cloudflare Worker</text><text x="476" y="164" font-size="15">App and authenticated</text><text x="476" y="187" font-size="15">request routing</text>
    <text x="819" y="58" font-size="18" font-weight="700">Durable Objects</text><text x="819" y="80" font-size="14">Workspace writes and documents</text>
    <text x="819" y="158" font-size="18" font-weight="700">D1</text><text x="819" y="180" font-size="14">Account directory</text>
