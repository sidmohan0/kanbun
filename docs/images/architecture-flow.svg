    <path d="M699 128 Q697 123 705 124 L933 126 Q941 127 939 134 L938 196 Q937 203 930 202 L704 201 Q697 200 699 194 Z" fill="#fff"/>
    <path d="M699 226 Q697 221 705 222 L933 224 Q941 225 939 232 L938 294 Q937 301 930 300 L704 299 Q697 298 699 292 Z" fill="#fff"/>
