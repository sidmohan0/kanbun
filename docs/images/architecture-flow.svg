<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
  <title id="title">How Kanbun connects clients and storage</title>
  <desc id="desc">Browser clients connect to a Cloudflare Worker, which routes workspace and document changes to Durable Objects and uses D1 for accounts and R2 for backups.</desc>
  <rect width="1000" height="340" rx="18" fill="#f8f6f1"/>
