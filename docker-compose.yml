services:
  postgres:
    image: postgres:17-alpine
    container_name: kanbun-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kanbun}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kanbun}
      POSTGRES_DB: ${POSTGRES_DB:-kanbun}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-kanbun} -d ${POSTGRES_DB:-kanbun}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
